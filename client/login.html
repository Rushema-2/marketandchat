<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - RwhatsApp</title>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

   <div>
     <h2>Login</h2>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <br><br>

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <br><br>

    <button onclick="login()">
        Login
    </button>

    <br>

<a
    href="forgot-password.html"
    id="forgotPasswordLink">
    Forgot password?
</a>

    <p id="message"></p>
   </div>

    <script src="js/login.js"></script>

</body>
</html>
