
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - RwhatsApp</title>

    <link rel="stylesheet" href="./css/register.css">
</head>

<body>

    <main class="register-container">

        <div class="register-card">

            <div class="logo">
                RwhatsApp
            </div>

            <h1>Create account</h1>

            <p class="subtitle">
                Register to start chatting
            </p>

            <form id="registerForm">

                <div class="name-row">

                    <div class="field">
                        <label for="firstName">
                            First name
                        </label>

                        <input
                            id="firstName"
                            type="text"
                            placeholder="John"
                            autocomplete="given-name"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="lastName">
                            Last name
                        </label>

                        <input
                            id="lastName"
                            type="text"
                            placeholder="Doe"
                            autocomplete="family-name"
                            required
                        >
                    </div>

                </div>

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="john@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="field">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        id="phone"
                        type="tel"
                        placeholder="0780000000"
                        autocomplete="tel"
                        required
                    >

                </div>

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <div
                    id="message"
                    class="message">
                </div>

                <button
                    id="registerBtn"
                    type="submit">
                    Create account
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>

        </div>

    </main>

    <script src="./js/register.js"></script>

</body>

</html>
